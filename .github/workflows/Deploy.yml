name: Build, Push e Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch: {}  
jobs:
  build-and-push:
    runs-on: ubuntu-latest   
    permissions:
      contents: read
      packages: write        
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Definir nome da imagem em minusculo
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/api-clubes" >> "$GITHUB_ENV"
        

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx (necessario pro cache type=gha)
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: ./API-PI-Clubes
          file: ./API-PI-Clubes/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted   
    steps:
      - name: Checkout (traz o docker-compose.api.yml atualizado do repo)
        uses: actions/checkout@v4

      - name: Gerar .env a partir dos secrets
        run: |
          cat > .env <<EOF
          MSSQL_SA_PASSWORD=${{ secrets.MSSQL_SA_PASSWORD }}
          ASPNETCORE_ENVIRONMENT=Development
          API_BASE_URL=http://api.clubera.dev
          PUBLIC_BASE_URL=http://www.clubera.dev
          EMAIL_SENDER=${{ secrets.EMAIL_SENDER }}
          EMAIL_SMTP_USERNAME=${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD=${{ secrets.EMAIL_SMTP_PASSWORD }}
          JWT_KEY=${{ secrets.JWT_KEY }}
          JWT_EMAIL_VERIFICATION_KEY=${{ secrets.JWT_EMAIL_VERIFICATION_KEY }}
          JWT_RESET_PASSWORD_KEY=${{ secrets.JWT_RESET_PASSWORD_KEY }}
          CPF_ENCRYPTION_KEY=${{ secrets.CPF_ENCRYPTION_KEY }}
          CPF_HMAC_KEY=${{ secrets.CPF_HMAC_KEY }}
          AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          MERCADOPAGO_ACCESS_TOKEN=${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_WEBHOOK_SECRET=${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
          EOF

      - name: Pull da imagem nova + restart da API
        run: |
          docker compose -f docker-compose.api.yml --env-file .env pull
          docker compose -f docker-compose.api.yml --env-file .env up -d
          docker image prune -f   
