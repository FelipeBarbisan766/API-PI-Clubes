name: Build, Push e Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite disparar manualmente pela aba Actions

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/api-clubes

jobs:
  build-and-push:
    runs-on: ubuntu-latest   # roda na infra do GitHub, nao no servidor local
    permissions:
      contents: read
      packages: write        # necessario pra dar push no GHCR
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted   # este job roda DENTRO do servidor local
    steps:
      - name: Checkout (traz o docker-compose.api.yml atualizado do repo)
        uses: actions/checkout@v4
        

      - name: Gerar .env a partir dos secrets
        run: |
          cat > .env <<EOF
          MSSQL_SA_PASSWORD=${{ secrets.MSSQL_SA_PASSWORD }}
          ASPNETCORE_ENVIRONMENT=Production
          API_BASE_URL=http://192.168.0.76:5000
          PUBLIC_BASE_URL=http://192.168.0.76:5050
          EMAIL_SENDER=${{ secrets.EMAIL_SENDER }}
          EMAIL_SMTP_USERNAME=${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD=${{ secrets.EMAIL_SMTP_PASSWORD }}
          EOF

      - name: Pull da imagem nova + restart da API
        run: |
          docker compose -f docker-compose.api.yml --env-file .env pull
          docker compose -f docker-compose.api.yml --env-file .env up -d
          docker image prune -f   # limpa imagens antigas pra nao acumular disco
