name: Build, Push e Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite disparar manualmente pela aba Actions

jobs:
  build-and-push:
    runs-on: ubuntu-latest   # roda na infra do GitHub, nao no seu notebook
    permissions:
      contents: read
      packages: write        # necessario pra dar push no GHCR
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Definir nome da imagem em minusculo
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/api-clubes" >> "$GITHUB_ENV"
        # Docker exige nome de repositorio 100% minusculo; o dono deste repo
        # (FelipeBarbisan766) tem maiuscula, entao converte aqui antes de usar.

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx (necessario pro cache type=gha)
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: ./API-PI-Clubes
          file: ./API-PI-Clubes/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted   # este job roda DENTRO do seu notebook
    steps:
      - name: Checkout (traz o docker-compose.api.yml atualizado do repo)
        uses: actions/checkout@v4
        # Atencao: por padrao o checkout roda "git clean -ffdx" antes,
        # o que apaga qualquer arquivo nao versionado da pasta (.env incluso).
        # Por isso o .env e GERADO no passo abaixo, a cada run, a partir
        # dos secrets do GitHub - nunca fica um .env fisico esperando aqui.

      - name: Gerar .env a partir dos secrets
        run: |
          cat > .env <<EOF
          MSSQL_SA_PASSWORD=${{ secrets.MSSQL_SA_PASSWORD }}
          ASPNETCORE_ENVIRONMENT=Production
          API_BASE_URL=http://192.168.0.76:5000
          PUBLIC_BASE_URL=http://192.168.0.76:5050
          EMAIL_SENDER=${{ secrets.EMAIL_SENDER }}
          EMAIL_SMTP_USERNAME=${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD=${{ secrets.EMAIL_SMTP_PASSWORD }}
          EOF

      - name: Pull da imagem nova + restart da API
        run: |
          docker compose -f docker-compose.api.yml --env-file .env pull
          docker compose -f docker-compose.api.yml --env-file .env up -d
          docker image prune -f   # limpa imagens antigas pra nao acumular disco
