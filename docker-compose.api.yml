version: "3.9"

# Sobe SOMENTE a API, usando a imagem ja pronta do GHCR
# (nada de build no servidor - notebook so faz pull + run).
# Depende do banco ja estar rodando na rede externa
# "homelab-network" (docker-compose.db.yml).
#
# Este e o compose que o GitHub Actions vai recriar a cada deploy.
#
# Subir:
#   docker compose -f docker-compose.api.yml --env-file .env pull
#   docker compose -f docker-compose.api.yml --env-file .env up -d

services:
  api:
    image: "${API_IMAGE:-ghcr.io/felipebarbisan766/api-clubes:latest}"
    pull_policy: always
    container_name: api-clubes
    restart: unless-stopped
    ports:
      - "5000:8080"
    volumes:
      - ./uploads:/app/wwwroot/uploads
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver-clubes,1433;Database=ClubesDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Email__SenderEmail: "${EMAIL_SENDER}"
      Email__SmtpPassword: "${EMAIL_SMTP_PASSWORD}"
      Email__SmtpUsername: "${EMAIL_SMTP_USERNAME}"
      Email__BaseUrl: "${PUBLIC_BASE_URL}"
      LocalStorage__BaseUrl: "${API_BASE_URL}"
    networks:
      - homelab-network

networks:
  homelab-network:
    external: true
